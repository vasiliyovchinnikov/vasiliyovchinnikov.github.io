<style>
:root{--bg:#0e1116;--panel:#161b23;--panel2:#1c232e;--border:#262f3d;--text:#e8ecf1;--muted:#8b96a5;--accent:#4f8cff;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:960px;margin:0 auto;padding:0 24px;width:100%}
header{padding:28px 0 0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#4f8cff,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;letter-spacing:.5px;flex:none}
.who{font-size:13.5px;color:var(--muted)}
.who b{display:block;color:var(--text);font-size:16.5px;font-weight:700}
.langs{display:flex;gap:8px}
.langs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{padding:64px 0 6px}
.hero h1{font-size:44px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.hero h1 .b{color:var(--accent)}
.hero p{color:var(--muted);margin-top:14px;font-size:17px;max-width:660px}
.seclabel{display:flex;align-items:center;gap:12px;margin:52px 0 22px;color:var(--muted);font-size:13px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
.seclabel:after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--text);transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 36px rgba(0,0,0,.5)}
.thumb{background:var(--panel2);border-bottom:1px solid var(--border)}
.thumb img{width:100%;display:block}
.cbody{padding:18px 20px 20px}
.cbody h2{font-size:20px;font-weight:700}
.cbody .sub{color:var(--muted);font-size:13px;margin-top:2px}
.cbody p{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;white-space:nowrap}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.go{color:var(--accent);font-weight:600;font-size:14px}
.yr{color:var(--muted);font-size:13px}
.card:hover .arr{transform:translateX(4px)}
.arr{display:inline-block;transition:transform .18s}
.hint{margin-top:28px;color:#5b6575;font-size:14px}
footer{margin-top:auto;border-top:1px solid var(--border);padding:22px 0 30px;color:#5b6575;font-size:14px}
.frow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}
@media(max-width:640px){.hero{padding:44px 0 4px}.hero h1{font-size:31px}.hero p{font-size:15.5px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <div class="logo">
        <div class="mark" id="mark">ВО</div>
        <div class="who"><b id="whoName">Василий Овчинников</b><span id="whoRole">публичные проекты</span></div>
      </div>
      <div class="langs">
        <button id="btnRu" class="on">Русский</button>
        <button id="btnEn">English</button>
      </div>
    </div>
  </header>
  <main class="hero">
    <h1 id="heroT"></h1>
    <p id="heroP"></p>
  </main>
  <div class="seclabel" id="secL"></div>
  <div class="grid" id="grid"></div>
  <div class="hint" id="hint"></div>
</div>
<footer>
  <div class="wrap frow">
    <span id="ftL">© 2026</span>
    <a href="https://github.com/vasiliyovchinnikov" target="_blank" rel="noopener" id="ftG">Исходники на GitHub →</a>
  </div>
</footer>
<script>
var L={
 ru:{mark:'ВО',whoName:'Василий Овчинников',whoRole:'публичные проекты',
     heroT:'Дашборды и данные — <span class="b">в открытом доступе</span>',
     heroP:'Интерактивные веб-приложения на данных исследований: всё считается прямо в браузере, ничего устанавливать не нужно.',
     sec:'Проекты',open:'Открыть',soon:'Здесь будут появляться новые проекты.',
     ftG:'Исходники на GitHub →',
     dT:'Гейминг в России 2026',dSub:'Gaming in Russia 2026',
     dP:'Интерактивный дашборд социологического исследования РВИ × НАФИ × ИФСИ: 4 932 респондента, 42 графика, живые фильтры и корреляции. Русский и английский.',
     tags:['Социология','4 932 респондента','42 графика','RU / EN']},
 en:{mark:'VO',whoName:'Vasily Ovchinnikov',whoRole:'public projects',
     heroT:'Dashboards and data — <span class="b">out in the open</span>',
     heroP:'Interactive web apps built on research data: everything runs right in your browser, nothing to install.',
     sec:'Projects',open:'Open',soon:'New projects will appear here.',
     ftG:'Source code on GitHub →',
     dT:'Gaming in Russia 2026',dSub:'Гейминг в России 2026',
     dP:'Interactive dashboard of the RVI × NAFI × IFSI survey: 4,932 respondents, 42 charts, live filters and correlations. Russian and English.',
     tags:['Survey data','4,932 respondents','42 charts','RU / EN']}
};
var PROJECTS=[{url:'https://vasiliyovchinnikov.github.io/gaming-in-russia-2026/',img:'og-cover.png',year:'2026'}];
var LANG='ru';
function $(id){return document.getElementById(id)}
function setLang(l){
  LANG=l;document.documentElement.lang=l;var t=L[l];
  $('btnRu').className=l==='ru'?'on':'';
  $('btnEn').className=l==='en'?'on':'';
  $('mark').textContent=t.mark;
  $('whoName').textContent=t.whoName;
  $('whoRole').textContent=t.whoRole;
  $('heroT').innerHTML=t.heroT;
  $('heroP').textContent=t.heroP;
  $('secL').textContent=t.sec;
  $('hint').textContent=t.soon;
  $('ftG').textContent=t.ftG;
  $('grid').innerHTML=PROJECTS.map(function(p){
    return '<a class="card" href="'+p.url+'">'
      +'<div class="thumb"><img src="'+p.img+'" alt="'+t.dT+'"></div>'
      +'<div class="cbody"><h2>'+t.dT+'</h2><div class="sub">'+t.dSub+'</div><p>'+t.dP+'</p>'
      +'<div class="tags">'+t.tags.map(function(x){return '<span class="tag">'+x+'</span>'}).join('')+'</div>'
      +'<div class="cfoot"><span class="go">'+t.open+' <span class="arr">→</span></span><span class="yr">'+p.year+'</span></div>'
      +'</div></a>';
  }).join('');
}
$('btnRu').onclick=function(){setLang('ru')};
$('btnEn').onclick=function(){setLang('en')};
setLang('ru');
</script>
</body>
</html>

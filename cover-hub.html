<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0e1116; font-family: 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; position: relative; }
  .accent { position: absolute; left: 56px; top: 120px; width: 8px; height: 230px; background: #4f8cff; border-radius: 4px; }
  h1 { position: absolute; left: 88px; top: 108px; font-size: 74px; letter-spacing: 1px; color: #e8ecf1; font-weight: 800; }
  h1 .blue { color: #4f8cff; }
  .ru { position: absolute; left: 90px; top: 268px; font-size: 40px; color: #9fabbb; font-weight: 600; }
  .org { position: absolute; left: 90px; top: 322px; font-size: 21px; color: #6b7686; font-weight: 500; letter-spacing: 2px; }
  .chart { position: absolute; right: 40px; top: 130px; width: 200px; display: flex; align-items: flex-end; gap: 18px; height: 260px; }
  .bar { width: 34px; border-radius: 6px 6px 0 0; }
  .baseline { position: absolute; right: 40px; top: 392px; width: 218px; height: 2px; background: #2a3340; }
  .foot { position: absolute; left: 90px; bottom: 24px; font-size: 17px; color: #4d5766; }
</style>
</head>
<body>
  <div class="accent"></div>
  <h1><span class="blue">PUBLIC</span><br>PROJECTS</h1>
  <div class="ru">Публичные проекты</div>
  <div class="org">ВАСИЛИЙ ОВЧИННИКОВ</div>
  <div class="chart">
    <div class="bar" style="height: 55%; background: #4f8cff;"></div>
    <div class="bar" style="height: 85%; background: #22c55e;"></div>
    <div class="bar" style="height: 68%; background: #4f8cff;"></div>
    <div class="bar" style="height: 100%; background: #22c55e;"></div>
  </div>
  <div class="baseline"></div>
  <div class="foot">Интерактивные дашборды · Открытые данные · RU / EN</div>
</body>
</html>
